name: Flaky transient check

# A test that genuinely flakes: it fails the first time a commit is built and
# passes when the same commit is run again. Keyed on run_attempt rather than
# randomness so the flake is reproducible -- one rerun always clears it.
#
# Only the queue's draft PR flakes. Failing on the author's own PR too would
# block it from ever being queued, since this check is required -- and a PR made
# green to get past that is then merged on its own result, so the queue never
# sees a failure to investigate.
#
# Keep this explanation out of the step below: GitHub echoes the raw script into
# the job log, where the classifier inspecting the failure would read it.

on:
  pull_request:

jobs:
  flaky-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install -q pytest
      - name: Write the suite
        env:
          HEAD_REF: ${{ github.head_ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          case "$HEAD_REF" in
            mq-bot-*) budget=1 ;;
            *)        budget=0 ;;
          esac
          if [ "$budget" = "1" ] && [ "$RUN_ATTEMPT" = "1" ]; then
            limit=0.05
          else
            limit=5.0
          fi
          mkdir -p flaketests
          cat > flaketests/test_checkout_total.py <<PY
          import time
          import pytest
          from decimal import Decimal

          TIMEOUT_SECONDS = $limit


          def fetch_tax_rate(region):
              """Stands in for the pricing service the real suite calls."""
              time.sleep(0.4)
              return Decimal("0.0875")


          def checkout_total(subtotal, region):
              deadline = time.monotonic() + TIMEOUT_SECONDS
              rate = fetch_tax_rate(region)
              if time.monotonic() > deadline:
                  raise TimeoutError(
                      f"pricing service did not answer within {TIMEOUT_SECONDS}s"
                  )
              return (subtotal * (1 + rate)).quantize(Decimal("0.01"))


          def test_checkout_total_applies_regional_tax():
              assert checkout_total(Decimal("100.00"), "CA-US") == Decimal("108.75")


          def test_checkout_total_handles_zero_subtotal():
              assert checkout_total(Decimal("0.00"), "CA-US") == Decimal("0.00")
          PY
      - name: Run tests
        run: pytest flaketests -v
