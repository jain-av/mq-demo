name: Flaky transient check

# The fixture for the exonerate path: a test suite with one genuinely flaky
# test. It fails the first time a commit is built and passes when the same
# commit is run again, so one rerun always clears it.
#
# The flake is an eventual-consistency timeout -- the kind of failure that
# actually recurs in CI -- so the log a classifier reads is a real pytest
# traceback rather than infrastructure chatter. What makes it reproducible
# lives in flaky_demo/conftest.py, out of the failing test's own traceback.
#
# Dormant unless the FLAKE_ARMED repository variable is "1", so the suite can be
# landed and left in place without flaking every draft the queue builds.

on:
  pull_request:

jobs:
  flaky-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # Kept to one line: GitHub echoes the script into the job log, and the
      # log is the evidence under test.
      - name: Run tests
        env:
          FLAKE_ARMED: ${{ vars.FLAKE_ARMED }}
          HEAD_REF: ${{ github.head_ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python -m pytest flaky_demo -v --tb=short
