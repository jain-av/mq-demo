name: Flaky transient check

# A check that genuinely flakes: it fails the first time a commit is built and
# passes when the same commit is run again. Keyed on run_attempt rather than
# randomness so the flake is reproducible -- one rerun always clears it.
#
# Only the queue's draft PR flakes. Failing on the author's own PR too would
# block it from ever being queued, since this check is required -- and a PR made
# green to get past that is then merged on its own result, so the queue never
# sees a failure to investigate.
#
# Keep this explanation out of the `run:` block below: GitHub includes the raw
# script in the job log, so anything written there is read by the classifier
# that inspects the failure.

on:
  pull_request:

jobs:
  flaky-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        env:
          HEAD_REF: ${{ github.head_ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          case "$HEAD_REF" in
            mq-bot-*) queued=yes ;;
            *)        queued=no  ;;
          esac
          if [ "$queued" = "yes" ] && [ "$RUN_ATTEMPT" = "1" ]; then
            echo "Pulling image ghcr.io/acme/test-runner:24.04"
            echo "##[error]failed to pull image ghcr.io/acme/test-runner:24.04: net/http: TLS handshake timeout"
            exit 1
          fi
          echo "Image pulled on attempt $RUN_ATTEMPT; tests passed"
